<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Selected Alpstack products</title>
  <desc id="desc">Product cards for Indraft, HousePulse, TinyDose, and MarkdownPaper.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0C1016"/><stop offset="1" stop-color="#101822"/></linearGradient>
    <linearGradient id="indraft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5D3FD3"/><stop offset="1" stop-color="#24194F"/></linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F06A3B"/><stop offset="1" stop-color="#5B1D18"/></linearGradient>
    <linearGradient id="dose" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0DAA82"/><stop offset="1" stop-color="#073F3B"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B07D48"/><stop offset="1" stop-color="#4A3728"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".34"/></filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#FFF" fill-opacity=".055"/></pattern>
    <style>
      .sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    </style>
  </defs>

  <rect width="1200" height="660" rx="28" fill="url(#bg)"/>
