<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Renish Bhaskaran, software architect, cloud engineer, and founder of Alpstack</title>
  <desc id="desc">A dark operator-console inspired banner showing Renish's product and engineering focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090B10"/>
      <stop offset=".58" stop-color="#10151B"/>
      <stop offset="1" stop-color="#071811"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(123 49) rotate(44) scale(445 338)">
      <stop stop-color="#FF6B2C" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FF6B2C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1117 559) rotate(-137) scale(490 355)">
      <stop stop-color="#64F7C2" stop-opacity=".18"/>
      <stop offset="1" stop-color="#64F7C2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFF" stroke-opacity=".035"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF6B2C"/><stop offset="1" stop-color="#64F7C2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    </style>
  </defs>

  <rect width="1200" height="610" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="610" rx="30" fill="url(#orangeGlow)"/>
  <rect width="1200" height="610" rx="30" fill="url(#mintGlow)"/>
  <rect x="1" y="1" width="1198" height="608" rx="29" fill="none" stroke="#FFF" stroke-opacity=".12" stroke-width="2"/>
  <rect x="24" y="24" width="1152" height="562" rx="19" fill="url(#grid)" stroke="#FFF" stroke-opacity=".07"/>

  <g class="mono" font-size="13" letter-spacing="1.6">
    <circle cx="55" cy="52" r="5" fill="#64F7C2"/>
    <text x="70" y="57" fill="#B8C0CC">RENISH / SYSTEM ONLINE</text>
    <text x="1145" y="57" text-anchor="end" fill="#77808D">11.0168° N · 76.9558° E</text>
  </g>
  <line x1="48" y1="78" x2="1152" y2="78" stroke="#FFF" stroke-opacity=".1"/>

  <g class="sans">
    <text x="65" y="145" fill="#FF8A55" font-size="15" font-weight="700" letter-spacing="3.4">SOFTWARE ARCHITECT · CLOUD ENGINEER · FOUNDER</text>
    <text x="61" y="230" fill="#F6F7F9" font-size="72" font-weight="750" letter-spacing="-3.5">RENISH</text>
    <text x="61" y="301" fill="#F6F7F9" font-size="72" font-weight="750" letter-spacing="-3.5">BHASKARAN</text>
    <rect x="64" y="334" width="430" height="4" rx="2" fill="url(#line)"/>
    <text x="64" y="385" fill="#CED3DA" font-size="25" font-weight="450">I design the systems.</text>
    <text x="64" y="423" fill="#F6F7F9" font-size="25" font-weight="700">Then I ship the product.</text>
  </g>

  <g transform="translate(659 117)" filter="url(#shadow)">
    <rect width="461" height="320" rx="18" fill="#0B0F14" fill-opacity=".82" stroke="#FFF" stroke-opacity=".12"/>
    <g class="mono">
      <text x="24" y="37" fill="#77808D" font-size="12" letter-spacing="1.4">SHIP LOOP / 01</text>
      <circle cx="410" cy="31" r="4" fill="#FF6B2C"/><circle cx="427" cy="31" r="4" fill="#64F7C2"/>
      <line x1="24" y1="57" x2="437" y2="57" stroke="#FFF" stroke-opacity=".09"/>
      <path d="M87 111H209M252 111H374M374 111V221H252M209 221H87M87 221V111" fill="none" stroke="#4D5968" stroke-width="1.5" stroke-dasharray="4 6"/>
      <path d="m187 106 10 5-10 5m165-10 10 5-10 5m-95 100-10 5 10 5M82 199l5 10 5-10" fill="none" stroke="#77808D" stroke-width="1.5"/>

      <g transform="translate(52 84)"><rect width="105" height="54" rx="10" fill="#161C24" stroke="#FF6B2C" stroke-opacity=".65"/><text x="52.5" y="33" fill="#FF9A6D" text-anchor="middle" font-size="12" font-weight="700">SIGNAL</text></g>
      <g transform="translate(209 84)"><rect width="105" height="54" rx="10" fill="#161C24" stroke="#8B9CF7" stroke-opacity=".65"/><text x="52.5" y="33" fill="#AAB6FF" text-anchor="middle" font-size="12" font-weight="700">SYSTEM</text></g>
      <g transform="translate(356 84)"><rect width="81" height="54" rx="10" fill="#161C24" stroke="#64F7C2" stroke-opacity=".65"/><text x="40.5" y="33" fill="#83FFD2" text-anchor="middle" font-size="12" font-weight="700">SHIP</text></g>
      <g transform="translate(209 194)"><rect width="105" height="54" rx="10" fill="#161C24" stroke="#FFE27A" stroke-opacity=".55"/><text x="52.5" y="33" fill="#FFE99B" text-anchor="middle" font-size="12" font-weight="700">LEARN</text></g>
      <g transform="translate(52 194)"><rect width="105" height="54" rx="10" fill="#161C24" stroke="#D782FF" stroke-opacity=".55"/><text x="52.5" y="33" fill="#E1A5FF" text-anchor="middle" font-size="12" font-weight="700">OPERATE</text></g>

      <text x="24" y="291" fill="#77808D" font-size="12">OWNED END-TO-END AT</text>
      <text x="176" y="291" fill="#64F7C2" font-size="12" font-weight="700">ALPSTACK</text>
    </g>
  </g>

  <g transform="translate(64 494)" class="mono">
    <g><text y="18" fill="#F6F7F9" font-size="22" font-weight="700">14+</text><text y="42" fill="#77808D" font-size="11" letter-spacing="1.2">YEARS BUILDING</text></g>
    <line x1="146" y1="0" x2="146" y2="46" stroke="#FFF" stroke-opacity=".12"/>
    <g transform="translate(180)"><text y="18" fill="#F6F7F9" font-size="22" font-weight="700">190+</text><text y="42" fill="#77808D" font-size="11" letter-spacing="1.2">ENGINEERS MENTORED</text></g>
    <line x1="390" y1="0" x2="390" y2="46" stroke="#FFF" stroke-opacity=".12"/>
    <g transform="translate(424)"><text y="18" fill="#F6F7F9" font-size="22" font-weight="700">9</text><text y="42" fill="#77808D" font-size="11" letter-spacing="1.2">STUDIO PRODUCTS</text></g>
    <g transform="translate(865)"><text x="205" y="18" fill="#FF8A55" text-anchor="end" font-size="14" font-weight="700">RENISH.ME ↗</text><text x="205" y="42" fill="#77808D" text-anchor="end" font-size="11" letter-spacing="1.2">COIMBATORE · WORLDWIDE</text></g>
  </g>
</svg>
